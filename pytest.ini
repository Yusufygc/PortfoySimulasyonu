[pytest]
addopts = -m "not manual and not network and not e2e"
markers =
    ui: Qt/QML arayuz testleri.
    integration: Tests that exercise integration boundaries without live network.
    network: Tests that require live external network access.
    real_data: Gerçek data/portfolio.db ve data/market_history.duckdb (kişisel, git dışı) gerektiren testler; dosyalar yoksa atlanır.
    manual: Tests or scripts intended for explicit manual execution only.
    e2e: Gercek kabukta fare/klavye suren urun testleri (python -m pytest -m e2e tests/e2e).
